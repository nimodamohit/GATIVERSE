version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: smartrail-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: smartrail-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
      - MONGODB_URI=mongodb://mongodb:27017/smartrail_eta
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      - mongodb

  ml-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ml-service
    container_name: smartrail-ml-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: smartrail-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend

volumes:
  mongo_data:
